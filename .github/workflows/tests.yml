name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch reviewed skill revision
        run: |
          git clone https://github.com/GalakCV/G-Skills.git .external/G-Skills
          git -C .external/G-Skills checkout 178cccf450791adfb2be58fe92bb674d6ff6f53d
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run offline tests without model credentials
        env:
          DEEPSEEK_API_KEY: ''
        run: python -m pytest -q
